let lang = 'html', idx = 0;

/* ── postMessage listener: iframe sends console logs here ── */
window.addEventListener('message', (e) => {
  if (!e.data || e.data.source !== 'wdp-console') return;
  appendLog(e.data.type, e.data.args);
});

function appendLog(type, args) {
  const out = document.getElementById('console-output');
  const empty = document.getElementById('c-empty');
  if (empty) empty.remove();
  const line = document.createElement('div');
  line.className = 'c-line ' + type;
  const icon = { log:'›', error:'✖', warn:'⚠', info:'ℹ' }[type] || '›';
  line.innerHTML = `<span class="c-icon">${icon}</span><span class="c-msg">${escHtml(args)}</span>`;
  out.appendChild(line);
  out.scrollTop = out.scrollHeight;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function clearConsole() {
  const out = document.getElementById('console-output');
  out.innerHTML = '<div class="c-empty" id="c-empty">Run your code to see output...</div>';
}

/* ── Build iframe srcdoc with injected console override ── */
function makeConsoleShim() {
  return `<script>
(function(){
  function ser(v){
    if(v===null) return 'null';
    if(v===undefined) return 'undefined';
    if(typeof v==='object'){try{return JSON.stringify(v);}catch(e){return String(v);}}
    return String(v);
  }
  function send(type,args){
    window.parent.postMessage({source:'wdp-console',type:type,args:args.map(ser).join(' ')},'*');
  }
  var _c=window.console||{};
  window.console={
    log:function(){send('log',[].slice.call(arguments));_c.log&&_c.log.apply(_c,arguments);},
    error:function(){send('error',[].slice.call(arguments));_c.error&&_c.error.apply(_c,arguments);},
    warn:function(){send('warn',[].slice.call(arguments));_c.warn&&_c.warn.apply(_c,arguments);},
    info:function(){send('info',[].slice.call(arguments));_c.info&&_c.info.apply(_c,arguments);},
  };
  window.addEventListener('error',function(e){send('error',[e.message+' (line '+e.lineno+')']);});
})();
<\/script>`;
}

function runCode() {
  const code = document.getElementById('code-editor').value;
  const frame = document.getElementById('preview-frame');
  const consoleWrap = document.getElementById('console-wrap');
  const lesson = data[lang][idx];

  clearConsole();

  if (lang === 'html') {
    frame.style.display = 'block'; frame.style.flex = '1';
    consoleWrap.style.display = 'none';
    frame.srcdoc = makeConsoleShim() + code;

  } else if (lang === 'css') {
    frame.style.display = 'block'; frame.style.flex = '1';
    consoleWrap.style.display = 'none';
    const html = lesson.preview || '<h2>Preview</h2><p>CSS applied here.</p>';
    frame.srcdoc = `<style>${code}</style>${html}`;

  } else {
    const hasPreview = !!lesson.preview;
    consoleWrap.style.display = 'flex';
    if (hasPreview) {
      frame.style.display = 'block';
      frame.style.flex = '0 0 45%';
      consoleWrap.style.flex = '0 0 55%';
      frame.srcdoc = makeConsoleShim() + `<script>${code}<\/script>` + lesson.preview;
    } else {
      frame.style.display = 'none';
      consoleWrap.style.flex = '1';
      frame.srcdoc = makeConsoleShim() + `<script>${code}<\/script>`;
    }
  }

  const items = document.querySelectorAll('.lesson-item');
  if (items[idx]) items[idx].classList.add('done');
}

function updateLineNums(code) {
  const n = code.split('\n').length;
  document.getElementById('line-nums').textContent = Array.from({length:n},(_,i)=>i+1).join('\n');
}

function loadLesson(i) {
  idx = i;
  const lesson = data[lang][i];
  document.getElementById('lesson-title').innerHTML = `${lesson.title} <span>— ${lesson.sub}</span>`;
  document.getElementById('task-text').textContent = lesson.task;
  document.getElementById('code-editor').value = lesson.code;
  updateLineNums(lesson.code);
  const files = {html:'index.html',css:'style.css',js:'script.js'};
  const badges = {html:'badge-html',css:'badge-css',js:'badge-js'};
  document.getElementById('file-label').textContent = files[lang];
  const b = document.getElementById('lang-badge');
  b.className = 'badge ' + badges[lang];
  b.textContent = lang.toUpperCase();
  renderList();
  runCode();
}

function renderList() {
  const list = document.getElementById('lesson-list');
  list.innerHTML = '';
  const sec = document.createElement('div');
  sec.className = 'section-label';
  sec.textContent = lang.toUpperCase() + ' Lessons';
  list.appendChild(sec);
  const acc = {html:'#f97316',css:'#38bdf8',js:'#facc15'}[lang];
  data[lang].forEach((l,i) => {
    const el = document.createElement('div');
    el.className = 'lesson-item' + (i===idx?' active':'') + (i<idx?' done':'');
    el.style.setProperty('--acc', acc);
    el.innerHTML = `<div class="check">${i<idx?'✓':''}</div><span class="num">0${i+1}</span><span>${l.title}</span>`;
    el.onclick = () => loadLesson(i);
    list.appendChild(el);
  });
}

function switchLang(l) {
  lang = l; idx = 0;
  const tabs = document.querySelectorAll('.lang-tab');
  tabs.forEach(t => t.className = 'lang-tab');
  tabs[['html','css','js'].indexOf(l)].className = 'lang-tab active-' + l;
  const colors = {html:'#f97316',css:'#0ea5e9',js:'#ca8a04'};
  document.getElementById('run-btn').style.background = colors[l];
  renderList();
  loadLesson(0);
}

function resetCode() {
  document.getElementById('code-editor').value = data[lang][idx].code;
  updateLineNums(data[lang][idx].code);
}
function showHint() { alert('Hint: ' + data[lang][idx].hint); }
function nextLesson() {
  const items = document.querySelectorAll('.lesson-item');
  if (items[idx]) { items[idx].classList.add('done'); if(items[idx].querySelector('.check')) items[idx].querySelector('.check').textContent='✓'; }
  if (idx < data[lang].length-1) { loadLesson(idx+1); }
  else {
    const order = ['html','css','js'], ni = order.indexOf(lang)+1;
    if (ni < order.length) { alert('Complete! Chalte hain '+order[ni].toUpperCase()+' pe!'); switchLang(order[ni]); }
    else alert('Sab complete! Tu ab ek Web Developer hai! 🏆');
  }
}

const editor = document.getElementById('code-editor');
editor.addEventListener('input', () => updateLineNums(editor.value));
editor.addEventListener('keydown', e => {
  if (e.key==='Tab') {
    e.preventDefault();
    const s = editor.selectionStart;
    editor.value = editor.value.substring(0,s)+'  '+editor.value.substring(editor.selectionEnd);
    editor.selectionStart = editor.selectionEnd = s+2;
    updateLineNums(editor.value);
  }
});

document.getElementById('run-btn').style.background = '#f97316';
renderList();
loadLesson(0);
</script>
